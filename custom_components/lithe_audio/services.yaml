play_url:
  name: Play URL
  description: Push a direct stream URL to a Lithe Audio speaker (HTTP/HTTPS audio).
  target:
    entity:
      domain: media_player
      integration: lithe_audio
  fields:
    url:
      name: URL
      description: Direct audio URL to play.
      required: true
      example: "http://192.168.1.100/announcement.mp3"
      selector:
        text:
    title:
      name: Player title
      description: Optional friendly title shown on the media player page.
      required: false
      example: "Morning announcement"
      selector:
        text:
set_name:
  name: Set Device Name
  description: Set the speaker's friendly name (visible in the Lithe app and AirPlay).
  target:
    entity:
      domain: media_player
      integration: lithe_audio
  fields:
    name:
      name: Name
      description: New device name.
      required: true
      example: "Living Room"
      selector:
        text:
set_dsp_eq:
  name: Set EQ Preset
  description: Set the EQ preset on a WiFi PRO 2, WiFi Speaker V3 or iO1.
  target:
    entity:
      domain: media_player
      integration: lithe_audio
  fields:
    preset:
      name: Preset
      description: EQ preset name.
      required: true
      selector:
        select:
          options:
            - Normal
            - Acoustic
            - Jazz
            - Pop
            - Hip-Hop
set_dsp_eq_band:
  name: Set EQ Band
  description: Set a captured Bass, Mid, or Treble value on a WiFi PRO 2 or WiFi Speaker V3.
  target:
    entity:
      domain: media_player
      integration: lithe_audio
  fields:
    band:
      name: Band
      description: EQ band to change.
      required: true
      selector:
        select:
          options:
            - Bass
            - Mid
            - Treble
    value:
      name: Value
      description: Gain from -5 to +5 dB.
      required: true
      selector:
        number:
          min: -5
          max: 5
          step: 1
          mode: slider
set_dsp_output:
  name: Set Speaker Output Mode
  description: Set mono/stereo/left/right output on a WiFi PRO 2, WiFi Speaker V3 or iO1.
  target:
    entity:
      domain: media_player
      integration: lithe_audio
  fields:
    mode:
      name: Mode
      description: Output mode.
      required: true
      selector:
        select:
          options:
            - Stereo
            - Mono
            - Left
            - Right
set_dsp_nightmode:
  name: Set Night Mode
  description: Enable or disable Night Mode on a WiFi PRO 2 or WiFi Speaker V3.
  target:
    entity:
      domain: media_player
      integration: lithe_audio
  fields:
    enabled:
      name: Enabled
      description: True to enable, False to disable.
      required: true
      selector:
        boolean:
set_dsp_balance:
  name: Set Balance
  description: Set left/right balance on a WiFi PRO 2, WiFi Speaker V3 or iO1.
  target:
    entity:
      domain: media_player
      integration: lithe_audio
  fields:
    balance:
      name: Balance
      description: "Balance value: -6 = full left, 0 = centre, +6 = full right."
      required: true
      selector:
        number:
          min: -6
          max: 6
          step: 1
          mode: slider
set_dsp_loudness:
  name: Set Loudness
  description: Enable or disable Loudness on a WiFi PRO 2 or WiFi Speaker V3.
  target:
    entity:
      domain: media_player
      integration: lithe_audio
  fields:
    enabled:
      name: Enabled
      description: True to enable, False to disable.
      required: true
      selector:
        boolean:
reboot:
  name: Reboot Speaker
  description: Reboot the speaker (equivalent to a power cycle). Takes ~45 seconds.
  target:
    entity:
      domain: media_player
      integration: lithe_audio
